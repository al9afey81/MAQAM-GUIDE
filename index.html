:root{--accent:#a38249;--bg:#f6f2e9;--panel:#fffcf6;--muted:#75634a;--line:#dfcfac;--off:#e8e0d2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#29241c;font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif;line-height:1.65}main{max-width:1060px;margin:auto;padding:28px 18px 55px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}h1{font-size:clamp(24px,5vw,36px);letter-spacing:2px;margin:0;direction:ltr;text-align:right}h2{margin:0;font-size:23px}p{margin:5px 0;color:var(--muted)}.brand{color:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0}label,.label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}button,select,input{font:inherit}button,select{background:#f4ede1;border:1px solid var(--line);color:#51432f;border-radius:9px;padding:10px;cursor:pointer}button:hover{border-color:var(--accent)}button.active{background:var(--accent);color:white;border-color:var(--accent)}.families{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}.keys{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;direction:ltr}select{width:100%;margin-bottom:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr;margin:20px 0}.metric{background:#f3ebdd;border-radius:10px;text-align:center;padding:12px}.metric b{display:block;color:var(--accent);font-size:20px}.metric small{color:var(--muted)}.notes{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;direction:ltr;margin:12px 0 20px}.note{text-align:center;min-width:0;direction:ltr}.note small{display:block;font-size:11px;color:var(--muted)}.cell{height:43px;background:var(--off);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:bold;color:#655640}.cell.on{background:var(--accent);color:white}.legend{display:flex;gap: </style></head><body><main><header><div><h1>MAQAM <span class="brand">GUIDE</span></h1><p>دليل إعدادات المقامات الشرقية · Auto-Tune Pro</p></div><div><label for="color">لون الواجهة</label><input type="color" id="color" value="#a38249"></div></header><section class="panel"><label>١. اختر المقام الرئيسي</label><div class="families" id="families"></div><label for="sub">٢. اختر المقام الفرعي</label><select id="sub"></select><label>٣. المفتاح الموسيقي</label><div class="keys" id="keys"></div></section><section class="panel"><div class="top"><div><h2 id="title"></h2></div></div><div class="legend"><span><i class="sw"></i>النغمة المسموحة</span><span><i class="sw off"></i>استبعاد عبر Remove</span></div><div id="grid"></div><div class="metrics" id="metrics"></div><div class="metrics secondary"><div class="metric"><small>Flex Tune</small><b>0</b></div><div class="metric"><small>Humanize</small><b>0</b></div><div class="metric"><small>Natural Vibrato</small><b>0</b></div><div class="metric"><small>Mix</small><b>100%</b></div></div><div class="actions"><button class="primary" id="copy">نسخ الإعدادات</button><button id="save">حفظ الإعدادات TXT</button></div><p id="status" role="status"></p></section></main><script>
